<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="86" viewBox="0 0 1200 86" role="img" aria-labelledby="title desc">
  <title id="title">Devil Hunter status panel</title>
  <desc id="desc">Animated Devil May Cry inspired status panel for a GitHub README.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06070b"/>
      <stop offset="50%" stop-color="#12070b"/>
      <stop offset="100%" stop-color="#07070a"/>
    </linearGradient>

    <linearGradient id="lineGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2b0a10" stop-opacity="0.1"/>
      <stop offset="20%" stop-color="#6f131d" stop-opacity="0.75"/>
      <stop offset="50%" stop-color="#b71b29" stop-opacity="0.95"/>
      <stop offset="80%" stop-color="#6f131d" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#2b0a10" stop-opacity="0.1"/>
    </linearGradient>

    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="1198" height="84" rx="8" fill="url(#bg)" stroke="#321019" stroke-width="1"/>

  <rect x="58" y="17" width="1084" height="1" fill="url(#lineGlow)" opacity="0.95"/>
  <rect x="58" y="69" width="1084" height="1" fill="url(#lineGlow)" opacity="0.55"/>

  <text x="68" y="33" fill="#f0e7e8" font-family="monospace" font-size="12" letter-spacing="2.5">DEVIL HUNTER MODE</text>
  <text x="68" y="56" fill="#ff3544" font-family="monospace" font-size="18" letter-spacing="4">ACTIVE</text>

  <text x="1132" y="33" text-anchor="end" fill="#f0e7e8" font-family="monospace" font-size="12" letter-spacing="2.5">NEXT COMMIT</text>
  <text x="1132" y="56" text-anchor="end" fill="#ff3544" font-family="monospace" font-size="18" letter-spacing="4">LOADED</text>

  <g transform="translate(600 42)">
    <circle r="22" fill="none" stroke="#62131c" stroke-width="1.1" opacity="0.95"/>
    <circle r="16" fill="none" stroke="#ff3142" stroke-width="1.2" filter="url(#glow)">
      <animate attributeName="opacity" values="0.35;0.95;0.35" dur="2.8s" repeatCount="indefinite"/>
    </circle>

    <path d="M0,-22 L6,-6 L22,0 L6,6 L0,22 L-6,6 L-22,0 L-6,-6 Z"
          fill="none" stroke="#ff3142" stroke-width="1.25" filter="url(#glow)" opacity="0.95">
      <animateTransform attributeName="transform" attributeType="XML" type="rotate" from="0 0 0" to="360 0 0" dur="15s" repeatCount="indefinite"/>
    </path>

    <path d="M0,-12 L12,0 L0,12 L-12,0 Z"
          fill="none" stroke="#a85e69" stroke-width="1">
      <animateTransform attributeName="transform" attributeType="XML" type="rotate" from="360 0 0" to="0 0 0" dur="10s" repeatCount="indefinite"/>
    </path>

    <circle r="4.2" fill="#ff3142" filter="url(#glow)">
      <animate attributeName="r" values="4.2;5.6;4.2" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.75;1;0.75" dur="2.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text x="600" y="33" text-anchor="middle" fill="#f4efef" font-family="monospace" font-size="13" letter-spacing="2.8">STYLE RANK: SSS</text>
  <text x="600" y="56" text-anchor="middle" fill="#bca6aa" font-family="monospace" font-size="10.5" letter-spacing="1.9">EBONY // IVORY</text>
</svg>
